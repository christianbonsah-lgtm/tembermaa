<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEMBERMA — Restaurant Africain · Lomé</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#120A07',
                            card: '#1D120C',
                            gold: '#D4AF37',
                            'gold-hover': '#b89528',
                            orange: '#C85A17',
                            border: '#332016'
                        }
                    },
                    fontFamily: {
                        serif: ['Georgia', 'serif']
                    }
                }
            }
        }
    </script>

    <!-- React & Babel CDNs -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-brand-dark text-stone-100 font-sans antialiased selection:bg-brand-gold selection:text-black">

    <div id="root"></div>

    <!-- Firebase SDK (v9 Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, collection, onSnapshot, addDoc, doc, updateDoc, deleteDoc 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA-vf9OPzqDhaOYFYVDaSoOR-9H2QPUPow",
            authDomain: "tembermaa-app.firebaseapp.com",
            projectId: "tembermaa-app",
            storageBucket: "tembermaa-app.firebasestorage.app",
            messagingSenderId: "76903191144",
            appId: "1:76903191144:web:9a615be1bbd8706947a1dd",
            measurementId: "G-WWC22B0JXT"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            window.db = db;
            window.fb = { collection, onSnapshot, addDoc, doc, updateDoc, deleteDoc };
        } catch (e) {
            console.error("Erreur Firebase:", e);
        }
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const DEFAULT_MENU = [
            {
                id: 1,
                name: "Foutou Banane & Sauce Graine Royale",
                category: "plats",
                price: 8500,
                prepTime: 25,
                desc: "Servi avec viandes sélectionnées et poisson fumé de la côte togolause.",
                badge: "Spécialité",
                img: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=800&q=80"
            },
            {
                id: 2,
                name: "Poulet Braisé aux Épices d'Atacora",
                category: "grillades",
                price: 7000,
                prepTime: 20,
                desc: "Mariné 24h aux herbes locales, servi avec alloco ou frites de yams.",
                badge: "Populaire",
                img: "https://images.unsplash.com/photo-1598515214211-89d3c73ae83b?auto=format&fit=crop&w=800&q=80"
            },
            {
                id: 3,
                name: "Tchinkounté de Poisson Frais",
                category: "plats",
                price: 9000,
                prepTime: 30,
                desc: "Soupe traditionnelle pimentée aux aromates de Kpalimé.",
                badge: "Chef",
                img: "https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?auto=format&fit=crop&w=800&q=80"
            }
        ];

        const ROLES_INFO = {
            '0000': { role: 'admin', label: 'Administrateur Général', icon: 'fa-user-shield' },
            '1111': { role: 'cuisine', label: 'Chef Cuisine', icon: 'fa-utensils' },
            '2222': { role: 'reception', label: 'Réception / Accueil', icon: 'fa-concierge-bell' },
            '3333': { role: 'serveur', label: 'Service en Salle', icon: 'fa-person-walking-luggage' },
            '4444': { role: 'caisse', label: 'Caisse & Facturation', icon: 'fa-cash-register' }
        };

        function App() {
            const [menuList, setMenuList] = useState(DEFAULT_MENU);
            const [activeCategory, setActiveCategory] = useState('tous');
            const [cart, setCart] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [isStaffLoginOpen, setIsStaffLoginOpen] = useState(false);
            
            const [currentStaff, setCurrentStaff] = useState(null);
            const [pinInput, setPinInput] = useState('');
            const [toast, setToast] = useState('');

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(''), 3500);
            };

            useEffect(() => {
                const interval = setInterval(() => {
                    if (window.db && window.fb) {
                        clearInterval(interval);
                        const { collection, onSnapshot } = window.fb;

                        onSnapshot(collection(window.db, "menu"), (snapshot) => {
                            if (!snapshot.empty) {
                                const dishes = snapshot.docs.map(doc => ({ docId: doc.id, ...doc.data() }));
                                setMenuList(dishes);
                            }
                        }, (err) => console.log("Erreur Firestore :", err));
                    }
                }, 200);

                return () => clearInterval(interval);
            }, []);

            const addToCart = (item) => {
                setCart(prev => {
                    const existing = prev.find(i => i.id === item.id);
                    if (existing) {
                        return prev.map(i => i.id === item.id ? { ...i, qty: i.qty + 1 } : i);
                    }
                    return [...prev, { ...item, qty: 1 }];
                });
                showToast(`"${item.name}" ajouté à la commande`);
            };

            const handleCheckout = async () => {
                if (cart.length === 0) return;
                const total = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
                
                const newOrder = {
                    id: 'CMD-' + Math.floor(1000 + Math.random() * 9000),
                    items: cart,
                    total: total,
                    status: 'En cuisine',
                    paymentStatus: 'Non payé',
                    createdAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    table: 'Table ' + Math.floor(1 + Math.random() * 12)
                };

                if (window.db && window.fb) {
                    await window.fb.addDoc(window.fb.collection(window.db, "commandes"), newOrder);
                }

                setCart([]);
                setIsCartOpen(false);
                showToast(`Commande ${newOrder.id} transmise !`);
            };

            const handleStaffLoginRequest = async (e) => {
                e.preventDefault();
                const roleInfo = ROLES_INFO[pinInput];
                if (!roleInfo) {
                    alert('Code PIN invalide.');
                    return;
                }

                if (roleInfo.role === 'admin') {
                    setCurrentStaff(roleInfo);
                    setIsStaffLoginOpen(false);
                    setPinInput('');
                    showToast('Bienvenue Administrateur');
                } else {
                    if (window.db && window.fb) {
                        await window.fb.addDoc(window.fb.collection(window.db, "staff_logins"), {
                            pin: pinInput, ...roleInfo, timestamp: new Date().toLocaleTimeString()
                        });
                    }
                    setIsStaffLoginOpen(false);
                    setPinInput('');
                    alert(`Demande transmise à l'Administrateur.`);
                }
            };

            const filteredMenu = activeCategory === 'tous' 
                ? menuList 
                : menuList.filter(item => item.category === activeCategory);

            return (
                <div className="min-h-screen flex flex-col relative">
                    {toast && (
                        <div className="fixed bottom-5 right-5 z-50 bg-brand-gold text-black px-4 py-3 rounded-lg shadow-xl font-bold flex items-center gap-2">
                            <i className="fa-solid fa-circle-check"></i>{toast}
                        </div>
                    )}

                    <header className="sticky top-0 z-40 bg-brand-dark/95 backdrop-blur-md border-b border-brand-border px-6 py-4 flex items-center justify-between">
                        <div className="flex items-center gap-2 text-brand-gold font-bold text-2xl tracking-widest cursor-pointer" onClick={() => setCurrentStaff(null)}>
                            <i className="fa-solid fa-utensils"></i>
                            <span>TEMBERMA</span>
                        </div>

                        <div className="flex items-center gap-3">
                            <button 
                                onClick={() => currentStaff ? setCurrentStaff(null) : setIsStaffLoginOpen(true)}
                                className={`px-3 py-1.5 rounded text-xs font-bold border transition ${currentStaff ? 'bg-brand-orange text-white border-brand-orange' : 'border-brand-gold/50 text-brand-gold'}`}
                            >
                                <i className={`fa-solid ${currentStaff ? 'fa-user-check' : 'fa-lock'} mr-1`}></i>
                                <span>{currentStaff ? currentStaff.label : 'Espace Staff'}</span>
                            </button>

                            <button onClick={() => setIsCartOpen(true)} className="relative p-2 text-brand-gold">
                                <i className="fa-solid fa-basket-shopping text-xl"></i>
                                {cart.length > 0 && (
                                    <span className="absolute -top-1 -right-1 bg-brand-orange text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold">
                                        {cart.reduce((a,b) => a + b.qty, 0)}
                                    </span>
                                )}
                            </button>
                        </div>
                    </header>

                    <main className="flex-1">
                        <section className="relative h-[50vh] flex items-center justify-center text-center px-4 bg-cover bg-center" style={{ backgroundImage: `linear-gradient(rgba(18, 10, 7, 0.75), rgba(18, 10, 7, 0.85)), url('https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=1350&q=80')` }}>
                            <div className="max-w-3xl">
                                <span className="text-brand-gold text-xs font-bold tracking-[0.3em] uppercase block mb-3">CUISINE AFRICAINE RAFFINÉE</span>
                                <h1 className="text-3xl md:text-5xl font-serif font-bold text-white mb-6">L'Âme de l'Atacora dans votre assiette</h1>
                            </div>
                        </section>

                        <section className="py-12 px-6 max-w-7xl mx-auto w-full">
                            <h2 className="text-2xl font-bold text-brand-gold mb-6 text-center">Notre Menu</h2>
                            <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
                                {filteredMenu.map(item => (
                                    <div key={item.docId || item.id} className="bg-brand-card border border-brand-border rounded-lg overflow-hidden flex flex-col p-4">
                                        <img src={item.img} className="w-full h-48 object-cover rounded mb-4" alt={item.name} />
                                        <h3 className="font-bold text-lg text-white">{item.name}</h3>
                                        <p className="text-stone-400 text-xs mb-3 flex-1">{item.desc}</p>
                                        <div className="flex justify-between items-center mt-auto">
                                            <span className="text-brand-gold font-bold">{item.price.toLocaleString()} FCFA</span>
                                            <button onClick={() => addToCart(item)} className="bg-brand-gold text-black font-bold px-3 py-1.5 rounded text-xs">
                                                Commander
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </section>
                    </main>

                    {isStaffLoginOpen && (
                        <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
                            <div className="bg-brand-card border border-brand-border rounded-lg p-6 max-w-sm w-full relative">
                                <button onClick={() => setIsStaffLoginOpen(false)} className="absolute top-4 right-4 text-stone-400">&times;</button>
                                <h3 className="text-xl font-bold text-brand-gold mb-4 text-center">Accès Staff</h3>
                                <form onSubmit={handleStaffLoginRequest} className="space-y-4">
                                    <input 
                                        type="password" 
                                        maxLength="4" 
                                        value={pinInput} 
                                        onChange={(e) => setPinInput(e.target.value)}
                                        placeholder="Code PIN"
                                        required 
                                        className="w-full bg-brand-dark border border-brand-border text-center text-2xl rounded p-3 text-white outline-none"
                                    />
                                    <button type="submit" className="w-full bg-brand-gold text-black font-bold py-2 rounded">
                                        Se connecter
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {isCartOpen && (
                        <div className="fixed inset-0 z-50 bg-black/80 flex justify-end">
                            <div className="bg-brand-card w-full max-w-md h-full p-6 flex flex-col justify-between border-l border-brand-border">
                                <div>
                                    <div className="flex justify-between items-center mb-6">
                                        <h3 className="text-xl font-bold text-white">Votre Commande</h3>
                                        <button onClick={() => setIsCartOpen(false)} className="text-stone-400 text-2xl">&times;</button>
                                    </div>
                                    {cart.map(item => (
                                        <div key={item.id} className="flex justify-between items-center bg-brand-dark p-3 rounded mb-2">
                                            <span className="text-white font-bold">{item.name} (x{item.qty})</span>
                                            <span className="text-brand-gold">{(item.price * item.qty).toLocaleString()} FCFA</span>
                                        </div>
                                    ))}
                                </div>
                                {cart.length > 0 && (
                                    <button onClick={handleCheckout} className="w-full bg-brand-gold text-black font-bold py-3 rounded">
                                        Valider la commande
                                    </button>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
